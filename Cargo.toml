[workspace]
resolver = "2"
members = [
    "crates/scavenger-core",
    "crates/scavenger-protocol",
    "crates/scavenger-agent",
    "crates/scavenger-controller",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
rust-version = "1.77"

[workspace.dependencies]
clap = { version = "4.5.20", features = ["derive"] }
axum = "0.7.9"
nvml-wrapper = "0.13.0"
prost = "0.13.5"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.41.1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.16"
tonic = { version = "0.12.3", features = ["tls"] }
tonic-build = "0.12.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
